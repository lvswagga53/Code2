<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martingale Pro</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    font-family: Arial;
    background: #0f0f0f;
    color: white;
    text-align: center;
}

.container {
    max-width: 420px;
    margin: auto;
}

input, button {
    padding: 10px;
    margin: 6px;
    width: 85%;
    font-size: 16px;
}

button { cursor: pointer; }

.loss { background: #c0392b; }
.win { background: #27ae60; }
.reset { background: gray; }

.result { font-size: 20px; margin-top: 10px; }

.stats, .ladder, .history {
    text-align: left;
    margin-top: 15px;
    background: #1c1c1c;
    padding: 10px;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Martingale Pro</h2>

    <input type="number" id="balance" placeholder="Account Balance ($)">
    <input type="number" id="riskPercent" placeholder="Risk % per trade">
    <input type="number" id="payout" placeholder="Payout %">
    <input type="number" id="maxSteps" placeholder="Max Steps">
    <input type="number" id="maxLossStreak" placeholder="Stop After X Losses">

    <div class="result">
        Balance: $<span id="balanceDisplay">0</span><br>
        Next Trade: $<span id="nextTrade">0</span>
    </div>

    <button class="loss" onclick="recordLoss()">Loss</button>
    <button class="win" onclick="recordWin()">Win</button>
    <button class="reset" onclick="resetAll()">Reset</button>

    <div class="stats">
        <b>Stats</b><br>
        Trades: <span id="trades">0</span><br>
        Wins: <span id="wins">0</span><br>
        Losses: <span id="losses">0</span><br>
        Win Rate: <span id="winrate">0%</span><br><br>

        Current Win Streak: <span id="winStreak">0</span><br>
        Current Loss Streak: <span id="lossStreak">0</span><br>
        Best Win Streak: <span id="bestWin">0</span><br>
        Best Loss Streak: <span id="bestLoss">0</span>
    </div>

    <div class="ladder">
        <b>Trade Ladder:</b>
        <div id="ladderList"></div>
    </div>

    <div class="history">
        <b>History:</b>
        <div id="historyList"></div>
    </div>
</div>

<script>
let balance = 0, riskPercent = 0, payout = 0;
let baseAmount = 0, totalLoss = 0, currentAmount = 0;
let step = 0, maxSteps = 0, maxLossStreak = 0;

// stats
let trades = 0, wins = 0, losses = 0;
let winStreak = 0, lossStreak = 0, bestWin = 0, bestLoss = 0;

function saveData() {
    localStorage.setItem("martingaleData", JSON.stringify({
        balance, trades, wins, losses,
        winStreak, lossStreak, bestWin, bestLoss
    }));
}

function loadData() {
    let data = JSON.parse(localStorage.getItem("martingaleData"));
    if (!data) return;

    balance = data.balance || 0;
    trades = data.trades || 0;
    wins = data.wins || 0;
    losses = data.losses || 0;
    winStreak = data.winStreak || 0;
    lossStreak = data.lossStreak || 0;
    bestWin = data.bestWin || 0;
    bestLoss = data.bestLoss || 0;

    balanceDisplay.innerText = balance.toFixed(2);
    updateStats();
}

function init() {
    if (baseAmount === 0) {
        balance = parseFloat(balanceInput.value) || balance;
        riskPercent = parseFloat(riskInput.value);
        payout = parseFloat(payoutInput.value);
        maxSteps = parseInt(maxStepsInput.value);
        maxLossStreak = parseInt(maxLossInput.value);

        baseAmount = balance * (riskPercent / 100);
        currentAmount = baseAmount;

        nextTrade.innerText = baseAmount.toFixed(2);
        balanceDisplay.innerText = balance.toFixed(2);

        generateLadder();
    }
}

function calculateNext() {
    currentAmount = (totalLoss + baseAmount) / (payout / 100);
    nextTrade.innerText = currentAmount.toFixed(2);
}

function generateLadder() {
    let html = "", tempLoss = 0;

    for (let i = 1; i <= maxSteps; i++) {
        let trade = (tempLoss + baseAmount) / (payout / 100);
        html += `Step ${i}: $${trade.toFixed(2)}<br>`;
        tempLoss += trade;
    }

    ladderList.innerHTML = html;
}

function recordLoss() {
    init();

    if (lossStreak >= maxLossStreak) {
        alert("STOP: Max loss streak reached!");
        return;
    }

    if (step >= maxSteps) {
        alert("Max steps reached!");
        return;
    }

    balance -= currentAmount;
    totalLoss += currentAmount;
    step++;

    trades++; losses++;
    lossStreak++; winStreak = 0;

    if (lossStreak > bestLoss) bestLoss = lossStreak;

    calculateNext();
    updateUI();
    addHistory(`Loss -$${currentAmount.toFixed(2)}`);
    saveData();
}

function recordWin() {
    init();

    let winAmount = currentAmount * (payout / 100);

    balance += winAmount;

    trades++; wins++;
    winStreak++; lossStreak = 0;

    if (winStreak > bestWin) bestWin = winStreak;

    totalLoss = 0;
    step = 0;
    currentAmount = baseAmount;

    nextTrade.innerText = baseAmount.toFixed(2);

    updateUI();
    addHistory(`Win +$${winAmount.toFixed(2)}`);
    saveData();
}

function updateStats() {
    tradesEl.innerText = trades;
    winsEl.innerText = wins;
    lossesEl.innerText = losses;

    let rate = trades ? (wins / trades * 100).toFixed(1) : 0;
    winrate.innerText = rate + "%";

    winStreakEl.innerText = winStreak;
    lossStreakEl.innerText = lossStreak;
    bestWinEl.innerText = bestWin;
    bestLossEl.innerText = bestLoss;
}

function updateUI() {
    balanceDisplay.innerText = balance.toFixed(2);
    updateStats();
}

function addHistory(text) {
    let div = document.createElement("div");
    div.innerText = text;
    historyList.prepend(div);
}

function resetAll() {
    localStorage.clear();
    location.reload();
}

// service worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

// refs
const balanceInput = document.getElementById("balance");
const riskInput = document.getElementById("riskPercent");
const payoutInput = document.getElementById("payout");
const maxStepsInput = document.getElementById("maxSteps");
const maxLossInput = document.getElementById("maxLossStreak");

const balanceDisplay = document.getElementById("balanceDisplay");
const nextTrade = document.getElementById("nextTrade");
const ladderList = document.getElementById("ladderList");
const historyList = document.getElementById("historyList");

const tradesEl = document.getElementById("trades");
const winsEl = document.getElementById("wins");
const lossesEl = document.getElementById("losses");
const winrate = document.getElementById("winrate");

const winStreakEl = document.getElementById("winStreak");
const lossStreakEl = document.getElementById("lossStreak");
const bestWinEl = document.getElementById("bestWin");
const bestLossEl = document.getElementById("bestLoss");

// load saved data
loadData();
</script>

</body>
</html>
